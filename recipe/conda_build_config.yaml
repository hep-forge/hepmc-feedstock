# python pinned to match ROOT's own build: hep-forge's root packages
# are published for one python per version family (6.34/6.36/6.38 ->
# 3.12, 6.32 -> 3.10); without this pin, conda-build tries conda-forge's
# global default python matrix (3.9-3.13), and any slot ROOT wasn't
# built for is unsatisfiable under strict channel priority (it won't
# fall back to conda-forge's own differently-versioned root package).
python:
  - "3.12"

c_stdlib:
  - sysroot                    # [linux]
  - macosx_deployment_target   # [osx]
  
c_stdlib_version:              # [unix]
  - 2.17                       # [linux]
  - 11.0                       # [osx]

# 6.36 dropped: 6.36.04 was only ever published for linux-64 (no
# linux-aarch64 build), so this variant slot was unconditionally
# unsatisfiable on arm64. Bumped 6.34 -> 6.38 to match edm4hep/podio
# (dd4hep needs hepmc/edm4hep/podio all built against the same root
# build-string tag to satisfy its own `pkg * root{{ root_tag }}` pins).
root:
  - 6.38

# ---- Compiler floor (ABI)
# Now that this recipe actually declares a compiler (see meta.yaml), pin
# the major rather than inheriting conda-build's "newest available".
# Unpinned, each rebuild silently takes whatever conda-forge shipped most
# recently -- that is how minio-cpp moved from GCC 15 to 16 between two
# rebuilds, published a libstdcxx >=16 run_export, and made its consumer
# unsolvable against the GCC 15-built rest of the stack.
# A floor, not a ceiling: raise per-package if the source needs newer.
c_compiler_version:    # [linux]
  - 14
cxx_compiler_version:  # [linux]
  - 14
libgcc_version:        # [linux]
  - 14.*
libstdcxx_version:     # [linux]
  - 14.*
